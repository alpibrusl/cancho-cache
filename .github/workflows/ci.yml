name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # The compiler these sources are built and tested with: part of the contract, since a source file does not
  # record which `std` it was written against. This is the commit of cancho #186 (`copy_within`); it moves to
  # cancho's main once that is merged.
  CANCHO_REV: a4572ea3b506e4bcec1c4be43deda1043c11ba9f

jobs:
  test:
    runs-on: ubuntu-latest
    # A step that hangs (a package mirror that does not answer, once, held a job for GitHub's six hours) fails instead.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: cache

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ env.CANCHO_REV }}
          path: cancho

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: cancho/target/release/cancho
          key: cancho-${{ env.CANCHO_REV }}

      - name: Build cancho
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: cargo build --release -p cancho

      - name: Redis, the oracle of the differential test
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -q && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -q redis-server

      - name: Parser tests (every string up to six bytes)
        working-directory: cache
        run: ../cancho/target/release/cancho test tests/resp_test.cho src/resp.cho --std

      - name: Pattern matcher tests
        working-directory: cache
        run: ../cancho/target/release/cancho test tests/glob_test.cho src/glob.cho --std

      - name: Store tests (collisions, backward-shift deletion, a randomised run against a model)
        working-directory: cache
        run: ../cancho/target/release/cancho test tests/store_test.cho src/store.cho --std

      - name: Formatting
        working-directory: cache
        run: ../cancho/target/release/cancho fmt --check src tests

      - name: Build
        working-directory: cache
        run: mkdir -p build && ../cancho/target/release/cancho build --std src/cache.cho src/resp.cho src/store.cho src/commands.cho src/reply.cho src/session.cho src/txn.cho src/glob.cho -o build/cache

      - name: Authority has no ffi, and reads only /dev/urandom (the hash seed)
        working-directory: cache
        run: |
          ../cancho/target/release/cancho authority src/cache.cho src/resp.cho src/store.cho src/commands.cho src/reply.cho src/session.cho src/txn.cho src/glob.cho --std > /tmp/authority.txt
          cat /tmp/authority.txt
          sed -n '/^performs/,/^never touches/p' /tmp/authority.txt | grep -q 'fs_read("/dev/urandom")'
          ! grep -q 'fs_write' /tmp/authority.txt
          sed -n '/never touches/,/provably pure/p' /tmp/authority.txt | grep -q "foreign code"

      # The same bytes into Redis and into the cache, four framings, replies compared byte for byte.
      - name: Differential test against Redis
        working-directory: cache
        run: python3 tests/differential.py build/cache

      - name: A full arena and a full key table refuse in Redis's words
        working-directory: cache
        run: python3 tests/limits.py build/cache

      - name: Client libraries for the session test (redis-py, ioredis, node-redis, redis-rs)
        working-directory: cache
        run: |
          pip install redis
          (cd tests/clients && npm install --no-audit --no-fund)
          (cd tests/clients/redis-rs && cargo build --release)
      - name: The client compatibility matrix, checked against the README's table
        working-directory: cache
        run: python3 tests/clients_matrix.py build/cache

      - name: The connection and server commands, and real clients connecting
        working-directory: cache
        run: python3 tests/session.py build/cache

      - name: Transactions that need two connections, and real clients running them
        working-directory: cache
        run: python3 tests/transactions.py build/cache

      - name: KEYS, SCAN and RENAME against Redis and against a model
        working-directory: cache
        run: python3 tests/keyspace.py build/cache

      - name: Expiry, the sweep, PTTL, and eviction under allkeys-lru
        working-directory: cache
        run: python3 tests/expiry.py build/cache

      - name: Hostile bytes do not stop it
        working-directory: cache
        run: python3 tests/fuzz_server.py build/cache
