name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # The compiler these sources are built and tested with: part of the contract, since a source file does not
  # record which `std` it was written against. This is the commit of lex-sys #186 (`copy_within`); it moves to
  # lex-sys's main once that is merged.
  LEX_SYS_REV: 0789e52d381d51474654050c578ddc029e45713d

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cache

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-sys
          ref: ${{ env.LEX_SYS_REV }}
          path: lex-sys

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: lex-sys/target/release/lex-sys
          key: lex-sys-${{ env.LEX_SYS_REV }}

      - name: Build lex-sys
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: lex-sys
        run: cargo build --release -p lex-sys

      - name: Redis, the oracle of the differential test
        run: sudo apt-get update -q && sudo apt-get install -y -q redis-server

      - name: Parser tests (every string up to six bytes)
        working-directory: cache
        run: ../lex-sys/target/release/lex-sys test tests/resp_test.ls src/resp.ls --std

      - name: Store tests (collisions, backward-shift deletion, a randomised run against a model)
        working-directory: cache
        run: ../lex-sys/target/release/lex-sys test tests/store_test.ls src/store.ls --std

      - name: Formatting
        working-directory: cache
        run: ../lex-sys/target/release/lex-sys fmt --check src tests

      - name: Build
        working-directory: cache
        run: mkdir -p build && ../lex-sys/target/release/lex-sys build --std src/cache.ls src/resp.ls src/store.ls src/commands.ls src/reply.ls src/session.ls -o build/cache

      - name: Authority has no ffi and no filesystem
        working-directory: cache
        run: |
          ../lex-sys/target/release/lex-sys authority src/cache.ls src/resp.ls src/store.ls src/commands.ls src/reply.ls src/session.ls --std > /tmp/authority.txt
          cat /tmp/authority.txt
          sed -n '/never touches/,/provably pure/p' /tmp/authority.txt | grep -q "foreign code"
          sed -n '/never touches/,/provably pure/p' /tmp/authority.txt | grep -q "the filesystem"

      # The same bytes into Redis and into the cache, four framings, replies compared byte for byte.
      - name: Differential test against Redis
        working-directory: cache
        run: python3 tests/differential.py build/cache

      - name: A full arena and a full key table refuse in Redis's words
        working-directory: cache
        run: python3 tests/limits.py build/cache

      - name: Client libraries for the session test (redis-py, ioredis)
        working-directory: cache
        run: |
          pip install redis
          (cd tests/clients && npm install --no-audit --no-fund)

      - name: The connection and server commands, and real clients connecting
        working-directory: cache
        run: python3 tests/session.py build/cache

      - name: Expiry, the sweep, PTTL, and eviction under allkeys-lru
        working-directory: cache
        run: python3 tests/expiry.py build/cache

      - name: Hostile bytes do not stop it
        working-directory: cache
        run: python3 tests/fuzz_server.py build/cache
