name: mutants

# Mutation test of the transaction layer (docs/design.md section 14.4): each mutant is a deliberately wrong cache and the harnesses must
# fail on it. It builds the cache once for each mutant, so it runs when the layer changes and on demand, not on every push.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/txn.cho
      - src/store.cho
      - src/cache.cho
      - tests/txn_mutants.py
      - tests/string_mutants.py
      - tests/mutlib.py
      - tests/keyspace_mutants.py
      - tests/pieces_mutants.py
      - tests/limits.py
      - src/resp.cho
      - tests/keyspace.py
      - src/glob.cho
      - src/commands.cho
      - tests/transactions.py
      - tests/differential.py

env:
  CANCHO_REV: a4572ea3b506e4bcec1c4be43deda1043c11ba9f

jobs:
  mutants:
    runs-on: ubuntu-latest
    # A step that hangs (a package mirror that does not answer, once, held a job for GitHub's six hours) fails instead.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: cache

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ env.CANCHO_REV }}
          path: cancho

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: cancho/target/release/cancho
          key: cancho-${{ env.CANCHO_REV }}

      - name: Build cancho
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: cargo build --release -p cancho

      - name: Redis, the oracle
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -q && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -q redis-server

      - name: Client libraries
        working-directory: cache
        run: |
          pip install redis
          (cd tests/clients && npm install --no-audit --no-fund)

      - name: Every mutant still applies to the source, exactly once (fast)
        working-directory: cache
        run: |
          for f in txn string keyspace pieces; do MUTANTS_LINT=1 CANCHO=x python3 tests/${f}_mutants.py; done

      - name: Every transaction mutant is caught
        working-directory: cache
        run: CANCHO=$PWD/../cancho/target/release/cancho python3 tests/txn_mutants.py

      - name: Every mutant of the answers in pieces is caught
        working-directory: cache
        run: CANCHO=$PWD/../cancho/target/release/cancho python3 tests/pieces_mutants.py

      - name: Every keyspace mutant is caught
        working-directory: cache
        run: CANCHO=$PWD/../cancho/target/release/cancho python3 tests/keyspace_mutants.py

      - name: Every string-command mutant is caught
        working-directory: cache
        run: CANCHO=$PWD/../cancho/target/release/cancho python3 tests/string_mutants.py
